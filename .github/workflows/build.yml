
name: Build Vagon Control APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repositoryni yuklash
        uses: actions/checkout@v4

      - name: Java 17 o‘rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle o‘rnatish
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Gradle loyihasini topish
        shell: bash
        run: |
          PROJECT_DIR=$(find . -name settings.gradle.kts -o -name settings.gradle | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Loyiha: $PROJECT_DIR"

      - name: APK yig‘ish
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: APK yuklash
        uses: actions/upload-artifact@v4
        with:
          name: Vagon-Control-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
