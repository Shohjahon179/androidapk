
name: Build Vagon Control APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Find Android project and install Gradle
        shell: bash
        run: |
          PROJECT_DIR="$(dirname "$(find . -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)")"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Android loyiha topilmadi!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          curl -L --fail -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.6-bin.zip

          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          /tmp/gradle-8.6/bin/gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vagon-Control-Premium-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
